spring.application.name=catalogo-lab
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
app.role=${APP_ROLE:catalogo}
app.message=${APP_MESSAGE:Ciao da Java}
app.demo-key=${DEMO_KEY:}
app.backend-url=${BACKEND_URL:http://catalogo:8080}
app.storage-enabled=${APP_STORAGE_ENABLED:false}
app.data-dir=${APP_DATA_DIR:/runtime}
